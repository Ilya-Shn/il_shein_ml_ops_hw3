name: hw3

x-app: &app
  build: .
  image: hw3-fraud-app
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
  volumes:
    - ./runtime:/runtime
    - ./data:/data:ro

x-airflow: &airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: hw3-airflow
  user: "50000:0"
  restart: unless-stopped
  environment:
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud:fraud@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__PARALLELISM: 2
    PYTHONPATH: /opt/project
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./pipeline:/opt/project/pipeline:ro
    - ./app:/opt/project/app:ro
    - ./tests:/opt/project/tests:ro
    - ./runtime:/runtime
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully
    bootstrap:
      condition: service_completed_successfully

services:
  permissions:
    image: python:3.11-slim
    user: "0:0"
    volumes:
      - ./runtime:/runtime
    command: ["sh", "-c", "chmod -R 777 /runtime"]

  bootstrap:
    <<: *app
    user: "50000:0"
    restart: "no"
    command: [python, -m, pipeline.bootstrap]
    depends_on:
      permissions:
        condition: service_completed_successfully

  airflow-db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fraud -d airflow]
      interval: 5s
      timeout: 5s
      retries: 30

  airflow-init:
    <<: *airflow
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow users list | grep -q 'admin' || airflow users create --username admin --password admin --firstname Илья --lastname Шеин --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 10s
      timeout: 5s
      retries: 30

  reports:
    image: python:3.11-slim
    restart: unless-stopped
    volumes:
      - ./runtime/reports:/reports:ro
    working_dir: /reports
    command: [python, -m, http.server, "8080"]
    ports:
      - "8082:8080"

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:9092, --list]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in transactions scores errors; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fraud -d fraud]
      interval: 5s
      timeout: 5s
      retries: 20

  scorer:
    <<: *app
    command: [python, -m, app.consumer]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  writer:
    <<: *app
    command: [python, -m, app.writer]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ui:
    <<: *app
    command: [python, -m, streamlit, run, app/ui.py, --server.address=0.0.0.0, --server.port=8501]
    ports:
      - "8503:8501"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kafka-data:
  postgres-data:
  airflow-db:
  airflow-logs:
